name: weekly-embeddings

on:
  schedule:
    # Run once every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  backfill:
    name: Backfill Gemini Embeddings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run embeddings backfill
        run: npx tsx scripts/backfill_embeddings.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
